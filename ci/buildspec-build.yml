version: 0.2

phases:
  pre_build:
    commands:
      - echo "Starting container image build..."

      - echo "Authenticating with Amazon ECR..."
      - |
        AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

        aws ecr get-login-password \
          --region "${AWS_DEFAULT_REGION}" |
        docker login \
          --username AWS \
          --password-stdin \
          "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

      - export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION}"

      - echo "Image tag:"
      - echo "${IMAGE_TAG}"

  build:
    commands:
      - echo "Building backend image..."

      - |
        docker build \
          --file docker/backend.Dockerfile \
          --tag "${BACKEND_REPOSITORY}:${IMAGE_TAG}" \
          ./backend

      - echo "Building frontend image..."

      - |
        docker build \
          --file docker/frontend.Dockerfile \
          --tag "${FRONTEND_REPOSITORY}:${IMAGE_TAG}" \
          ./frontend

  post_build:
    commands:
      - echo "Scanning backend image..."

      - |
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:0.57.1 \
          image \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          "${BACKEND_REPOSITORY}:${IMAGE_TAG}"

      - echo "Scanning frontend image..."

      - |
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:0.57.1 \
          image \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          "${FRONTEND_REPOSITORY}:${IMAGE_TAG}"

      - echo "Pushing backend image..."
      - docker push "${BACKEND_REPOSITORY}:${IMAGE_TAG}"

      - echo "Pushing frontend image..."
      - docker push "${FRONTEND_REPOSITORY}:${IMAGE_TAG}"

      - echo "Container build and push completed."

artifacts:
  files:
    - "**/*"