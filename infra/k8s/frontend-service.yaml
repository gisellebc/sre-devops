apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: sre-challenge

  labels:
    app: frontend

  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing

spec:
  type: LoadBalancer

  selector:
    app: frontend

  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP